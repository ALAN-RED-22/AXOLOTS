version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/store"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Agrupa actualizaciones menores/patch en un solo PR para no saturar;
      # las major siguen llegando por separado para revisar con más cuidado.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
